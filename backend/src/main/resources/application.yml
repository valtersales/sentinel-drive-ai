# Sentinel Drive Backend - main configuration
spring:
  application:
    name: sentinel-drive-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sentineldrive}
    username: ${SPRING_DATASOURCE_USERNAME:sentineldrive}
    password: ${SPRING_DATASOURCE_PASSWORD:sentineldrive}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
